[project]
name = "aidoctors-backend"
version = "1.0.0"
description = "FastAPI backend for AIDoctors CSC490 project"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.104.1",
    "uvicorn[standard]==0.24.0",
    "pydantic==2.5.0",
    "pydantic-settings==2.1.0",
    "python-dotenv==1.0.0",
    "python-multipart==0.0.6",
    "python-jose[cryptography]>=3.5.0",
    "passlib[bcrypt]>=1.7.4",
    "sqlalchemy>=2.0.44",
    "bcrypt==4.3.0",
    "boto3>=1.35.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.25.0",
]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "databases[sqlite]>=0.9.0",
    "httpx>=0.25.0,<0.27.0",
    "pytest-mock>=3.15.1",
    "pytest-cov>=7.0.0",
    "coverage[toml]>=7.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.coverage.run]
source = ["app"]
omit = [
    "*/tests/*",
    "*/app/config/config.py",
    "*/app/db/models/*",
    "*/app/schemas/*",
    "*/app/db/session.py",
    "*/app/db/setup.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning:passlib.*:",
]
addopts = "--cov=app --cov-report=term-missing"
