name: Terraform CI/CD

on:
    workflow_dispatch:
    push:
        branches:
            - main
        paths:
            - "terraform/**"

permissions:
    id-token: write
    contents: read

jobs:
    terraform-apply:
        if: github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        environment:
            name: "prod"
        env:
            AWS_REGION: "us-east-1"
            TF_VERSION: "1.13.4"
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: "Install Terraform"
              uses: hashicorp/setup-terraform@v2
              with:
                  terraform_version: ${{ env.TF_VERSION }}
                  terraform_wrapper: false

            - name: "Configure AWS credentials"
              uses: aws-actions/configure-aws-credentials@v3
              with:
                  role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
                  role-session-name: ${{ github.run_id }}
                  aws-region: ${{ env.AWS_REGION }}

            - name: "Terraform Init"
              working-directory: terraform
              run: terraform init

            - name: "Get current image tag from Terraform output"
              id: get-image-tag
              working-directory: terraform
              run: |
                  CURRENT_TAG=$(terraform output -raw app_image_tag 2>/dev/null || echo "latest")
                  echo "current_tag=$CURRENT_TAG" >> $GITHUB_OUTPUT
                  echo "Current app_image_tag: $CURRENT_TAG"

            - name: "Terraform Apply"
              working-directory: terraform
              run: |
                  echo "Applying Terraform with current image tag: ${{ steps.get-image-tag.outputs.current_tag }}"
                  terraform apply -auto-approve \
                    -var="app_image_tag=${{ steps.get-image-tag.outputs.current_tag }}"
