name: Backend Testing

on:
    workflow_dispatch:
    pull_request:
        branches: "*"
        paths:
            - "src/application/backend/**"

permissions:
    id-token: write
    contents: read
    pull-requests: write
    issues: write

jobs:
    backend_test:
        runs-on: ubuntu-latest
        env:
            TESTING: "true"

        defaults:
            run:
                working-directory: src/application/backend

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v4
              with:
                  python-version: "3.12"

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install uv
                  uv sync

            - name: Run pytest and capture output
              id: pytest
              shell: bash
              continue-on-error: true
              run: |
                  set -o pipefail
                  uv run -m pytest 2>&1 | tee pytest-output.txt

            - name: Comment pytest results on PR
              if: github.event_name == 'pull_request'
              uses: actions/github-script@v7
              with:
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  script: |
                      const fs = require('fs');
                      const path = require('path');

                      const outputPath = path.join('src', 'application', 'backend', 'pytest-output.txt');
                      const testOutput = fs.readFileSync(outputPath, 'utf8');

                      const output = `#### Backend Test Results
                      <details><summary>Show Output</summary>

                      \`\`\`text
                      ${testOutput}
                      \`\`\`

                      </details>

                      *Pusher: @${{ github.actor }}, Action: \`${{ github.event_name }}\`, Workflow: \`${{ github.workflow }}\`*`;

                      github.rest.issues.createComment({
                          issue_number: context.issue.number,
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          body: output
                      });
