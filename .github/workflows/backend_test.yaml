name: Backend Testing

on:
    workflow_dispatch:
    pull_request:
        branches: "*"
        paths:
            - "src/application/backend/**"

jobs:
    backend_test:
        runs-on: ubuntu-latest

        defaults:
            run:
                working-directory: src/application/backend

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v4
              with:
                  python-version: "3.12"

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install uv
                  uv sync

            - name: Run pytest and capture output
              id: pytest
              shell: bash
              continue-on-error: true
              run: |
                  set -o pipefail
                  uv run -m pytest 2>&1 | tee pytest-output.txt
                  echo "exitcode=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

            - name: Comment pytest results on PR
              if: github.event_name == 'pull_request'
              uses: actions/github-script@v7
              with:
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  script: |
                      const fs = require('fs');
                      const path = require('path');

                      const outputPath = path.join('src', 'application', 'backend', 'pytest-output.txt');
                      const output = fs.readFileSync(outputPath, 'utf8');

                      // truncate very long output so comment doesn't explode
                      const MAX_LENGTH = 6000;
                      let bodyText = output.length > MAX_LENGTH
                        ? output.slice(0, MAX_LENGTH) + '\n\n... (truncated)'
                        : output;

                      const body = [
                        '```text',
                        bodyText,
                        '```'
                      ].join('\n');

                      await github.rest.issues.createComment({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        issue_number: context.issue.number,
                        body,
                      });
